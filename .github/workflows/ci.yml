name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Head refs are only branch names and can collide across forked PRs. Use
  # the PR number for pull requests so one contributor cannot cancel or queue
  # behind another contributor's identically named branch. Pushes retain the
  # branch ref, and are never cancelled, preserving main evidence.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  required-checks:
    name: Required Linux checks
    runs-on: ubuntu-latest
    # The canonical verify plan has an 80-minute budget. Keep enough room for
    # image setup, cache restoration, and durable artifact upload before the
    # runner's hard deadline.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # hashFiles() is only valid in step-level expressions, not
      # workflow/job-level `env:`, so compute the cache key here and
      # export it for later steps.
      - name: Compute cache key
        run: |
          echo "SWIFT_CACHE_KEY=swiftpm-v2-6.3-linux-${{ hashFiles('Package.resolved', '.devcontainer/Dockerfile', '.devcontainer/image-lock.json') }}" >> "$GITHUB_ENV"
          # Compiler intermediates and planner metadata are specific to the
          # development container toolchain. Key them by the reviewed image
          # identity too, so an image-lock refresh never reuses a cache built
          # with a different container (SwiftPM emits a fatal incremental
          # build error when incremental state is incompatible).
          image_identity=$(jq -er '.buildInputsSha256' .devcontainer/image-lock.json)
          SWIFT_BUILD_CACHE_PREFIX="swift-build-v3-compiler-6.3-linux-${image_identity}-${{ hashFiles('Package.resolved', '**/Package.swift', '.devcontainer/Dockerfile') }}-"
          echo "SWIFT_BUILD_CACHE_PREFIX=${SWIFT_BUILD_CACHE_PREFIX}" >> "$GITHUB_ENV"
          echo "SWIFT_BUILD_CACHE_KEY=${SWIFT_BUILD_CACHE_PREFIX}${GITHUB_SHA}" >> "$GITHUB_ENV"
          ESP_IDF_CCACHE_PREFIX="esp-idf-ccache-v1-${image_identity}-"
          echo "ESP_IDF_CCACHE_PREFIX=${ESP_IDF_CCACHE_PREFIX}" >> "$GITHUB_ENV"
          echo "ESP_IDF_CCACHE_KEY=${ESP_IDF_CCACHE_PREFIX}${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Prepare verification diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .testing/runs
          : > .testing/required-checks.log

      - name: Setup container image
        uses: ./.github/actions/setup-container
        with:
          runtime: podman
          # Canonical verification is implemented by the tooling binary, so CI
          # must never execute orchestration embedded from a stale revision.
          require-current-build-inputs: "true"
          # The image workflow is separate and path-filtered, so this job
          # cannot observe its live publication state. The setup action still
          # supports publisher-in-progress for callers with concrete evidence;
          # CI uses the no-wait bounded fallback here.
          content-tag-prefix: swift-6.3
          candidate-tag-prefix: ${{ github.event_name == 'pull_request' && format('swift-6.3-pr-{0}', github.event.pull_request.number) || 'swift-6.3' }}

      - name: Restore SwiftPM dependency cache
        id: swiftpm_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .swiftpm-cache
          key: ${{ env.SWIFT_CACHE_KEY }}

      # Keep this separate from the download cache. Cache compiler intermediates
      # and planner metadata: final binaries, fuzz output, tooling, and ESP-IDF
      # trees made the old archive 2.69 GB and could exhaust a runner before
      # Podman started the test container.
      #
      # The index store must be cached too. SwiftPM incremental builds open the
      # prior index-store unit for a file when it is recompiled; restoring
      # build.db/*.build/Modules/ModuleCache without index/store leaves those
      # incremental records referencing unit files that do not exist, which
      # fails with `Failed opening .../index/store/v5/units/...: No such file`.
      - name: Restore Swift compiler cache
        id: swift_build_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/ci/build.db
            .build/ci/checkouts
            .build/ci/debug.yaml
            .build/ci/plugin-tools.yaml
            .build/ci/workspace-state.json
            .build/ci/plugins
            .build/ci/repositories
            .build/ci/x86_64-unknown-linux-gnu/debug/*.build
            .build/ci/x86_64-unknown-linux-gnu/debug/description.json
            .build/ci/x86_64-unknown-linux-gnu/debug/index/store
            .build/ci/x86_64-unknown-linux-gnu/debug/Modules
            .build/ci/x86_64-unknown-linux-gnu/debug/ModuleCache
            .build/ci/tooling/build.db
            .build/ci/tooling/debug.yaml
            .build/ci/tooling/workspace-state.json
            .build/ci/tooling/x86_64-unknown-linux-gnu/debug/*.build
            .build/ci/tooling/x86_64-unknown-linux-gnu/debug/description.json
            .build/ci/tooling/x86_64-unknown-linux-gnu/debug/index/store
            .build/ci/tooling/x86_64-unknown-linux-gnu/debug/Modules
            .build/ci/packages/*/build.db
            .build/ci/packages/*/debug.yaml
            .build/ci/packages/*/plugin-tools.yaml
            .build/ci/packages/*/workspace-state.json
            .build/ci/packages/*/plugins
            .build/ci/packages/*/x86_64-unknown-linux-gnu/debug/*.build
            .build/ci/packages/*/x86_64-unknown-linux-gnu/debug/description.json
            .build/ci/packages/*/x86_64-unknown-linux-gnu/debug/index/store
            .build/ci/packages/*/x86_64-unknown-linux-gnu/debug/Modules
            .build/ci/packages/*/x86_64-unknown-linux-gnu/debug/ModuleCache
          key: ${{ env.SWIFT_BUILD_CACHE_KEY }}
          restore-keys: |
            ${{ env.SWIFT_BUILD_CACHE_PREFIX }}

      - name: Restore ESP-IDF compiler cache
        id: esp_idf_ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/axoloty/esp-idf-ccache
          key: ${{ env.ESP_IDF_CCACHE_KEY }}
          restore-keys: |
            ${{ env.ESP_IDF_CCACHE_PREFIX }}

      - name: Run canonical CI verification plan
        env:
          AXOLOTY_OUTPUT: human
          # Rootless Podman may need longer than the default two minutes to
          # create the first container after a locally rebuilt image.
          CONTAINER_CREATE_TIMEOUT_SECONDS: "300"
          AXOLOTY_RUNS_DIR: .testing/runs
          AXOLOTY_TIMING_EVIDENCE: "1"
        run: |
          set -o pipefail
          make verify-ci CONTAINER_RUNTIME=podman BUILD_DIR=".build/ci" BUILD_LOCK=0 SPM_CACHE_DIR=.swiftpm-cache AXOLOTY_TOOL_CONTAINER_ENV_VARS="AXOLOTY_OUTPUT CONTAINER_CREATE_TIMEOUT_SECONDS AXOLOTY_RUNS_DIR AXOLOTY_TIMING_EVIDENCE" 2>&1 | tee .testing/required-checks.log

      - name: Report Swift build cache reuse
        if: always()
        env:
          CACHE_EXACT_HIT: ${{ steps.swift_build_cache.outputs.cache-hit || 'false' }}
          CACHE_MATCHED_KEY: ${{ steps.swift_build_cache.outputs.cache-matched-key || 'none' }}
        run: |
          {
            echo "### Swift build cache"
            echo "- Exact hit: \`${CACHE_EXACT_HIT}\`"
            echo "- Restored key: \`${CACHE_MATCHED_KEY}\`"
            echo "- Active path: \`.build/ci\`"
            du -sh .build/ci 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize verification evidence
        if: always()
        env:
          SWIFTPM_EXACT_HIT: ${{ steps.swiftpm_cache.outputs.cache-hit || 'false' }}
          SWIFT_COMPILER_EXACT_HIT: ${{ steps.swift_build_cache.outputs.cache-hit || 'false' }}
          SWIFT_COMPILER_MATCHED_KEY: ${{ steps.swift_build_cache.outputs.cache-matched-key || 'none' }}
          ESP_IDF_EXACT_HIT: ${{ steps.esp_idf_ccache.outputs.cache-hit || 'false' }}
          ESP_IDF_MATCHED_KEY: ${{ steps.esp_idf_ccache.outputs.cache-matched-key || 'none' }}
        shell: bash
        run: |
          set -euo pipefail
          manifests=$(find .testing/runs -type f -name manifest.json -print 2>/dev/null | wc -l)
          verifier_logs=$(find .testing/runs -type f -name verifier.log -print 2>/dev/null | wc -l)
          primary_reports=()
          while IFS= read -r -d '' report; do
            if jq -e '.schemaVersion == 1 and .primary == true' "$report" >/dev/null; then
              primary_reports+=("$report")
            fi
          done < <(find .testing/runs -type f -name '*-verify-ci.json' -print0 2>/dev/null)
          {
            echo "### Verification evidence"
            echo "- Run manifests: \`${manifests}\`"
            echo "- Verifier logs: \`${verifier_logs}\`"
            echo "- Primary verify-ci reports: \`${#primary_reports[@]}\`"
            if [ "$manifests" -eq 0 ] || [ "$verifier_logs" -eq 0 ]; then
              echo "- Warning: the tooling did not leave a complete run artifact set."
            fi
            echo
            echo "### Cache state"
            echo "- SwiftPM exact hit: \`${SWIFTPM_EXACT_HIT}\`"
            echo "- Swift compiler exact hit: \`${SWIFT_COMPILER_EXACT_HIT}\`"
            echo "- Swift compiler restored key: \`${SWIFT_COMPILER_MATCHED_KEY}\`"
            echo "- ESP-IDF exact hit: \`${ESP_IDF_EXACT_HIT}\`"
            echo "- ESP-IDF restored key: \`${ESP_IDF_MATCHED_KEY}\`"
            du -sh .swiftpm-cache .build/ci "$HOME/.cache/axoloty/esp-idf-ccache" 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${#primary_reports[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one primary verify-ci report, found ${#primary_reports[@]}."
            exit 1
          fi
          markdown_report="${primary_reports[0]%.json}.md"
          if [ ! -f "$markdown_report" ]; then
            echo "::error::Primary verify-ci Markdown report is missing: $markdown_report"
            exit 1
          fi
          cat "$markdown_report" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate SwiftPM dependency cache before failure-safe save
        id: swiftpm_cache_health
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.swiftpm_cache.outcome == 'success' && steps.swiftpm_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -u
          if make resolve CONTAINER_RUNTIME=podman BUILD_DIR=".build/ci" BUILD_LOCK=0 SPM_CACHE_DIR=.swiftpm-cache; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "SwiftPM dependency cache passed a post-plan resolution check and is safe to save."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SwiftPM dependency cache failed post-plan validation; it will not be saved."
          fi

      # SwiftPM's cache is content-addressed downloaded dependency data. A
      # successful post-plan resolve proves the cache is complete even when a
      # later test failed. The compiler cache below remains success-only: its
      # mutable incremental state must never be archived from a failed build.
      - name: Save SwiftPM dependency cache
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.swiftpm_cache_health.outputs.ready == 'true' && steps.swiftpm_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .swiftpm-cache
          key: ${{ env.SWIFT_CACHE_KEY }}

      - name: Save Swift compiler cache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.swift_build_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/ci/build.db
            .build/ci/checkouts
            .build/ci/debug.yaml
            .build/ci/plugin-tools.yaml
            .build/ci/workspace-state.json
            .build/ci/plugins
            .build/ci/repositories
            .build/ci/x86_64-unknown-linux-gnu/debug/*.build
            .build/ci/x86_64-unknown-linux-gnu/debug/description.json
            .build/ci/x86_64-unknown-linux-gnu/debug/index/store
            .build/ci/x86_64-unknown-linux-gnu/debug/Modules
            .build/ci/x86_64-unknown-linux-gnu/debug/ModuleCache
            .build/ci/tooling/build.db
            .build/ci/tooling/debug.yaml
            .build/ci/tooling/workspace-state.json
            .build/ci/tooling/x86_64-unknown-linux-gnu/debug/*.build
            .build/ci/tooling/x86_64-unknown-linux-gnu/debug/description.json
            .build/ci/tooling/x86_64-unknown-linux-gnu/debug/index/store
            .build/ci/tooling/x86_64-unknown-linux-gnu/debug/Modules
            .build/ci/packages/*/build.db
            .build/ci/packages/*/debug.yaml
            .build/ci/packages/*/plugin-tools.yaml
            .build/ci/packages/*/workspace-state.json
            .build/ci/packages/*/plugins
            .build/ci/packages/*/x86_64-unknown-linux-gnu/debug/*.build
            .build/ci/packages/*/x86_64-unknown-linux-gnu/debug/description.json
            .build/ci/packages/*/x86_64-unknown-linux-gnu/debug/index/store
            .build/ci/packages/*/x86_64-unknown-linux-gnu/debug/Modules
            .build/ci/packages/*/x86_64-unknown-linux-gnu/debug/ModuleCache
          key: ${{ env.SWIFT_BUILD_CACHE_KEY }}

      - name: Save ESP-IDF compiler cache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.esp_idf_ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/axoloty/esp-idf-ccache
          key: ${{ env.ESP_IDF_CCACHE_KEY }}

      - name: Upload verification run diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-runs-${{ github.run_id }}
          path: |
            .testing/required-checks.log
            .testing/runs/**
          if-no-files-found: warn
          retention-days: 7

  coverage:
    name: Source coverage
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify source coverage scope
        id: coverage_scope
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          changed="$RUNNER_TEMP/coverage-changed-paths.txt"
          : > "$changed"
          force=""
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            force=--force
          elif [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            # Treat renames as delete/add pairs so moving covered source into
            # a fast-path directory cannot hide the source-side change.
            git diff --no-renames --name-only "$BASE_SHA" "$HEAD_SHA" > "$changed"
          else
            echo "::warning::Coverage base commit is unavailable; running full coverage."
            force=--force
          fi
          classification=$(node Tests/Support/classify-coverage-change.mjs --changed-file-list "$changed" $force)
          printf '%s\n' "$classification"
          marker=$(printf '%s\n' "$classification" | sed -n '1p')
          if [ "$marker" = coverage=required ]; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          elif [ "$marker" = coverage=fastpath ]; then
            echo "required=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Coverage classifier returned an invalid marker: $marker"
            exit 1
          fi
          {
            echo "### Source coverage scope"
            printf '%s\n' "$classification" | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Compute cache key
        if: steps.coverage_scope.outputs.required == 'true'
        run: |
          echo "SWIFT_CACHE_KEY=swiftpm-v2-6.3-linux-${{ hashFiles('Package.resolved', '.devcontainer/Dockerfile', '.devcontainer/image-lock.json') }}" >> "$GITHUB_ENV"

      - name: Prepare coverage diagnostics
        if: steps.coverage_scope.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .testing/coverage
          : > .testing/coverage/job.log

      - name: Setup container image
        if: steps.coverage_scope.outputs.required == 'true'
        uses: ./.github/actions/setup-container
        with:
          runtime: podman
          require-current-build-inputs: "true"
          content-tag-prefix: swift-6.3
          candidate-tag-prefix: ${{ github.event_name == 'pull_request' && format('swift-6.3-pr-{0}', github.event.pull_request.number) || 'swift-6.3' }}

      - name: Restore SwiftPM dependency cache
        if: steps.coverage_scope.outputs.required == 'true'
        id: swiftpm_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .swiftpm-cache
          key: ${{ env.SWIFT_CACHE_KEY }}

      - name: Run coverage plan
        if: steps.coverage_scope.outputs.required == 'true'
        env:
          COVERAGE_DIFF_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        shell: bash
        run: |
          set -o pipefail
          make coverage-check CONTAINER_RUNTIME=podman BUILD_DIR=".build/coverage" COVERAGE_BUILD_DIR=".build/coverage" BUILD_LOCK=0 SPM_CACHE_DIR=.swiftpm-cache 2>&1 | tee .testing/coverage/job.log

      - name: Require coverage report
        if: always() && steps.coverage_scope.outputs.required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s .testing/coverage/report.json ]; then
            echo "::error::Coverage did not produce .testing/coverage/report.json" >&2
            exit 1
          fi
          if [ ! -s .testing/coverage/report.txt ]; then
            echo "::error::Coverage did not produce .testing/coverage/report.txt" >&2
            exit 1
          fi

      - name: Upload coverage report
        if: always() && steps.coverage_scope.outputs.required == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report-${{ github.run_id }}
          path: |
            .testing/coverage/report.json
            .testing/coverage/report.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload coverage diagnostics
        if: always() && steps.coverage_scope.outputs.required == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-diagnostics-${{ github.run_id }}
          path: .testing/coverage/**
          if-no-files-found: warn
          retention-days: 7

  prune-build-caches:
    name: Prune superseded Swift build caches
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: required-checks
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Keep two adjacent-commit caches and remove legacy layouts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cache_ids="$RUNNER_TEMP/swift-build-cache-ids"
          gh cache list --ref refs/heads/main --key "swift-build-v3-compiler-6.3-linux-" \
            --sort created_at --order desc --limit 100 --json id --jq '.[2:][].id' > "$cache_ids"
          gh cache list --ref refs/heads/main --key "swift-build-v2-coverage-6.3-linux-" \
            --limit 100 --json id --jq '.[].id' >> "$cache_ids"
          gh cache list --ref refs/heads/main --key "swift-build-coverage-6.3-linux-" \
            --limit 100 --json id --jq '.[].id' >> "$cache_ids"
          while IFS= read -r cache_id; do
            [ -n "$cache_id" ] || continue
            gh cache delete "$cache_id"
          done < "$cache_ids"
