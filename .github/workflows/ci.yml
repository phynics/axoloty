name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  apple-build:
    name: Apple build
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build all products and test targets
        run: |
          swift --version
          brew list swiftlint >/dev/null 2>&1 || brew install swiftlint
          brew list ripgrep >/dev/null 2>&1 || brew install ripgrep
          brew list node@22 >/dev/null 2>&1 || brew install node@22
          export PATH="$(brew --prefix node@22)/bin:$PATH"
          node --version
          mkdir -p .testing
          swift build --package-path Tools --product axoloty-tool >&2
          swift run --package-path Tools --skip-build axoloty-tool check > .testing/axoloty-tool-check-macos.json

      - name: Upload Apple axoloty-tool check manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: axoloty-tool-check-macos-${{ github.run_id }}
          path: .testing/axoloty-tool-check-macos.json
          if-no-files-found: warn
          retention-days: 7

  required-checks:
    name: Required Linux checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      # hashFiles() is only valid in step-level expressions, not
      # workflow/job-level `env:`, so compute the cache key here and
      # export it for later steps.
      - name: Compute cache key
        run: |
          echo "SWIFT_CACHE_KEY=swiftpm-6.3-linux-${{ hashFiles('Package.resolved', '.devcontainer/Dockerfile') }}" >> "$GITHUB_ENV"

      - name: Setup container image
        uses: ./.github/actions/setup-container
        with:
          runtime: podman

      - name: Restore SwiftPM dependency cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .swiftpm-cache
          key: ${{ env.SWIFT_CACHE_KEY }}
          restore-keys: |
            swiftpm-6.3-linux-

      - name: Prepare changed-line diff
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .testing/coverage
          git diff --unified=0 "$BASE_SHA" "$GITHUB_SHA" > .testing/coverage/changed.diff

      - name: Run consolidated checks
        env:
          COVERAGE_DIFF_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: |
          mkdir -p .testing
          make check CONTAINER_RUNTIME=podman BUILD_DIR=.build BUILD_LOCK=0 SPM_CACHE_DIR=.swiftpm-cache > .testing/axoloty-tool-check-linux.json
          make coverage-check CONTAINER_RUNTIME=podman BUILD_DIR=.build COVERAGE_BUILD_DIR=.build BUILD_LOCK=0 SPM_CACHE_DIR=.swiftpm-cache
          sh Tests/Support/check-decoder-context-diagnostic.sh .testing/coverage/build.log

      - name: Upload axoloty-tool check manifests
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: axoloty-tool-check-${{ github.run_id }}
          path: .testing/axoloty-tool-check-*.json
          if-no-files-found: warn
          retention-days: 7

      - name: Save SwiftPM dependency cache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .swiftpm-cache
          key: ${{ env.SWIFT_CACHE_KEY }}

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-summary-${{ github.run_id }}
          path: |
            .testing/coverage/report.json
            .testing/coverage/report.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Upload coverage diagnostics
        if: failure() || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-diagnostics-${{ github.run_id }}
          path: .testing/coverage/
          if-no-files-found: warn
          retention-days: 7
