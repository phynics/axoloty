name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  required-checks:
    name: Required Linux checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # hashFiles() is only valid in step-level expressions, not
      # workflow/job-level `env:`, so compute the cache key here and
      # export it for later steps.
      - name: Compute cache key
        run: |
          echo "SWIFT_CACHE_KEY=swiftpm-6.3-linux-${{ hashFiles('Package.resolved', '.devcontainer/Dockerfile') }}" >> "$GITHUB_ENV"
          echo "SWIFT_BUILD_CACHE_KEY=swift-build-coverage-6.3-linux-${{ hashFiles('Package.resolved', '**/Package.swift', '.devcontainer/Dockerfile') }}" >> "$GITHUB_ENV"

      - name: Setup container image
        uses: ./.github/actions/setup-container
        with:
          runtime: podman
          # Canonical verification is implemented by the tooling binary, so CI
          # must never execute orchestration embedded from a stale revision.
          require-current-build-inputs: "true"
          # A same-repository PR image workflow publishes the immutable image
          # in parallel. Wait for it instead of rebuilding on every fresh CI
          # runner; retain the local fallback if publication fails.
          wait-for-published-seconds: "600"
          candidate-tag-prefix: ${{ github.event_name == 'pull_request' && format('swift-6.3-pr-{0}', github.event.pull_request.number) || 'swift-6.3' }}

      - name: Restore SwiftPM dependency cache
        id: swiftpm_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .swiftpm-cache
          key: ${{ env.SWIFT_CACHE_KEY }}
          restore-keys: |
            swiftpm-6.3-linux-

      # Keep this separate from the download cache: SwiftPM can incrementally
      # rebuild changed project sources while reusing compiled dependencies.
      - name: Restore Swift coverage build cache
        id: swift_build_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ env.SWIFT_BUILD_CACHE_KEY }}
          restore-keys: |
            swift-build-coverage-6.3-linux-

      - name: Prepare changed-line diff
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .testing/coverage
          git diff --unified=0 "$BASE_SHA" "$GITHUB_SHA" > .testing/coverage/changed.diff

      - name: Run canonical CI verification plan
        env:
          COVERAGE_DIFF_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          AXOLOTY_OUTPUT: human
        run: |
          mkdir -p .testing
          make verify-ci CONTAINER_RUNTIME=podman BUILD_DIR=".build/${GITHUB_SHA}" COVERAGE_BUILD_DIR=".build/${GITHUB_SHA}-coverage" BUILD_LOCK=0 SPM_CACHE_DIR=.swiftpm-cache AXOLOTY_TOOL_CONTAINER_ENV_VARS=AXOLOTY_OUTPUT

      - name: Save SwiftPM dependency cache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.swiftpm_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .swiftpm-cache
          key: ${{ env.SWIFT_CACHE_KEY }}

      - name: Save Swift coverage build cache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.swift_build_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ env.SWIFT_BUILD_CACHE_KEY }}

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-summary-${{ github.run_id }}
          path: |
            .testing/coverage/report.json
            .testing/coverage/report.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload coverage diagnostics
        if: failure() || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-diagnostics-${{ github.run_id }}
          path: .testing/coverage/
          if-no-files-found: ignore
          retention-days: 7
