name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  required-checks:
    name: Required Linux checks
    runs-on: ubuntu-latest
    # The canonical verify plan has an 80-minute budget. Keep enough room for
    # image setup, cache restoration, and durable artifact upload before the
    # runner's hard deadline.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # hashFiles() is only valid in step-level expressions, not
      # workflow/job-level `env:`, so compute the cache key here and
      # export it for later steps.
      - name: Compute cache key
        run: |
          echo "SWIFT_CACHE_KEY=swiftpm-v2-6.3-linux-${{ hashFiles('Package.resolved', '.devcontainer/Dockerfile', '.devcontainer/image-lock.json') }}" >> "$GITHUB_ENV"
          # Compiler intermediates and planner metadata are specific to the
          # development container toolchain. Key them by the reviewed image
          # identity too, so an image-lock refresh never reuses a cache built
          # with a different container (SwiftPM emits a fatal incremental
          # build error when incremental state is incompatible).
          image_identity=$(jq -er '.buildInputsSha256' .devcontainer/image-lock.json)
          SWIFT_BUILD_CACHE_PREFIX="swift-build-v3-compiler-6.3-linux-${image_identity}-${{ hashFiles('Package.resolved', '**/Package.swift', '.devcontainer/Dockerfile') }}-"
          echo "SWIFT_BUILD_CACHE_PREFIX=${SWIFT_BUILD_CACHE_PREFIX}" >> "$GITHUB_ENV"
          echo "SWIFT_BUILD_CACHE_KEY=${SWIFT_BUILD_CACHE_PREFIX}${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Prepare verification diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .testing/runs
          : > .testing/required-checks.log

      - name: Setup container image
        uses: ./.github/actions/setup-container
        with:
          runtime: podman
          # Canonical verification is implemented by the tooling binary, so CI
          # must never execute orchestration embedded from a stale revision.
          require-current-build-inputs: "true"
          # The image workflow is separate and path-filtered, so this job
          # cannot observe its live publication state. The setup action still
          # supports publisher-in-progress for callers with concrete evidence;
          # CI uses the no-wait bounded fallback here.
          content-tag-prefix: swift-6.3
          candidate-tag-prefix: ${{ github.event_name == 'pull_request' && format('swift-6.3-pr-{0}', github.event.pull_request.number) || 'swift-6.3' }}

      - name: Restore SwiftPM dependency cache
        id: swiftpm_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .swiftpm-cache
          key: ${{ env.SWIFT_CACHE_KEY }}

      # Keep this separate from the download cache. Cache compiler intermediates
      # and planner metadata: final binaries, fuzz output, tooling, and ESP-IDF
      # trees made the old archive 2.69 GB and could exhaust a runner before
      # Podman started the test container.
      #
      # The index store must be cached too. SwiftPM incremental builds open the
      # prior index-store unit for a file when it is recompiled; restoring
      # build.db/*.build/Modules/ModuleCache without index/store leaves those
      # incremental records referencing unit files that do not exist, which
      # fails with `Failed opening .../index/store/v5/units/...: No such file`.
      - name: Restore Swift compiler cache
        id: swift_build_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/ci/build.db
            .build/ci/checkouts
            .build/ci/debug.yaml
            .build/ci/plugin-tools.yaml
            .build/ci/workspace-state.json
            .build/ci/plugins
            .build/ci/repositories
            .build/ci/x86_64-unknown-linux-gnu/debug/*.build
            .build/ci/x86_64-unknown-linux-gnu/debug/description.json
            .build/ci/x86_64-unknown-linux-gnu/debug/index/store
            .build/ci/x86_64-unknown-linux-gnu/debug/Modules
            .build/ci/x86_64-unknown-linux-gnu/debug/ModuleCache
          key: ${{ env.SWIFT_BUILD_CACHE_KEY }}
          restore-keys: |
            ${{ env.SWIFT_BUILD_CACHE_PREFIX }}

      - name: Run canonical CI verification plan
        env:
          AXOLOTY_OUTPUT: human
          AXOLOTY_RUNS_DIR: .testing/runs
        run: |
          set -o pipefail
          make verify-ci CONTAINER_RUNTIME=podman BUILD_DIR=".build/ci" BUILD_LOCK=0 SPM_CACHE_DIR=.swiftpm-cache AXOLOTY_TOOL_CONTAINER_ENV_VARS="AXOLOTY_OUTPUT AXOLOTY_RUNS_DIR" 2>&1 | tee .testing/required-checks.log

      - name: Report Swift build cache reuse
        if: always()
        env:
          CACHE_EXACT_HIT: ${{ steps.swift_build_cache.outputs.cache-hit || 'false' }}
          CACHE_MATCHED_KEY: ${{ steps.swift_build_cache.outputs.cache-matched-key || 'none' }}
        run: |
          {
            echo "### Swift build cache"
            echo "- Exact hit: \`${CACHE_EXACT_HIT}\`"
            echo "- Restored key: \`${CACHE_MATCHED_KEY}\`"
            echo "- Active path: \`.build/ci\`"
            du -sh .build/ci 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize verification evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          manifests=$(find .testing/runs -type f -name manifest.json -print 2>/dev/null | wc -l)
          verifier_logs=$(find .testing/runs -type f -name verifier.log -print 2>/dev/null | wc -l)
          {
            echo "### Verification evidence"
            echo "- Run manifests: \`${manifests}\`"
            echo "- Verifier logs: \`${verifier_logs}\`"
            if [ "$manifests" -eq 0 ] || [ "$verifier_logs" -eq 0 ]; then
              echo "- Warning: the tooling did not leave a complete run artifact set."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate SwiftPM dependency cache before failure-safe save
        id: swiftpm_cache_health
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.swiftpm_cache.outcome == 'success' && steps.swiftpm_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -u
          if make resolve CONTAINER_RUNTIME=podman BUILD_DIR=".build/ci" BUILD_LOCK=0 SPM_CACHE_DIR=.swiftpm-cache; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "SwiftPM dependency cache passed a post-plan resolution check and is safe to save."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SwiftPM dependency cache failed post-plan validation; it will not be saved."
          fi

      # SwiftPM's cache is content-addressed downloaded dependency data. A
      # successful post-plan resolve proves the cache is complete even when a
      # later test failed. The compiler cache below remains success-only: its
      # mutable incremental state must never be archived from a failed build.
      - name: Save SwiftPM dependency cache
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.swiftpm_cache_health.outputs.ready == 'true' && steps.swiftpm_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .swiftpm-cache
          key: ${{ env.SWIFT_CACHE_KEY }}

      - name: Save Swift compiler cache
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.swift_build_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/ci/build.db
            .build/ci/checkouts
            .build/ci/debug.yaml
            .build/ci/plugin-tools.yaml
            .build/ci/workspace-state.json
            .build/ci/plugins
            .build/ci/repositories
            .build/ci/x86_64-unknown-linux-gnu/debug/*.build
            .build/ci/x86_64-unknown-linux-gnu/debug/description.json
            .build/ci/x86_64-unknown-linux-gnu/debug/index/store
            .build/ci/x86_64-unknown-linux-gnu/debug/Modules
            .build/ci/x86_64-unknown-linux-gnu/debug/ModuleCache
          key: ${{ env.SWIFT_BUILD_CACHE_KEY }}

      - name: Upload verification run diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-runs-${{ github.run_id }}
          path: |
            .testing/required-checks.log
            .testing/runs/**
          if-no-files-found: warn
          retention-days: 7

  coverage:
    name: Source coverage
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compute cache key
        run: |
          echo "SWIFT_CACHE_KEY=swiftpm-v2-6.3-linux-${{ hashFiles('Package.resolved', '.devcontainer/Dockerfile', '.devcontainer/image-lock.json') }}" >> "$GITHUB_ENV"

      - name: Prepare coverage diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .testing/coverage
          : > .testing/coverage/job.log

      - name: Setup container image
        uses: ./.github/actions/setup-container
        with:
          runtime: podman
          require-current-build-inputs: "true"
          content-tag-prefix: swift-6.3
          candidate-tag-prefix: ${{ github.event_name == 'pull_request' && format('swift-6.3-pr-{0}', github.event.pull_request.number) || 'swift-6.3' }}

      - name: Restore SwiftPM dependency cache
        id: swiftpm_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .swiftpm-cache
          key: ${{ env.SWIFT_CACHE_KEY }}

      - name: Run coverage plan
        env:
          COVERAGE_DIFF_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        shell: bash
        run: |
          set -o pipefail
          make coverage-check CONTAINER_RUNTIME=podman BUILD_DIR=".build/coverage" COVERAGE_BUILD_DIR=".build/coverage" BUILD_LOCK=0 SPM_CACHE_DIR=.swiftpm-cache 2>&1 | tee .testing/coverage/job.log

      - name: Require coverage report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s .testing/coverage/report.json ]; then
            echo "::error::Coverage did not produce .testing/coverage/report.json" >&2
            exit 1
          fi
          if [ ! -s .testing/coverage/report.txt ]; then
            echo "::error::Coverage did not produce .testing/coverage/report.txt" >&2
            exit 1
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report-${{ github.run_id }}
          path: |
            .testing/coverage/report.json
            .testing/coverage/report.txt
          if-no-files-found: error
          retention-days: 7

      - name: Upload coverage diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-diagnostics-${{ github.run_id }}
          path: .testing/coverage/**
          if-no-files-found: warn
          retention-days: 7

  prune-build-caches:
    name: Prune superseded Swift build caches
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: required-checks
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Keep two adjacent-commit caches and remove legacy layouts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cache_ids="$RUNNER_TEMP/swift-build-cache-ids"
          gh cache list --ref refs/heads/main --key "swift-build-v3-compiler-6.3-linux-" \
            --sort created_at --order desc --limit 100 --json id --jq '.[2:][].id' > "$cache_ids"
          gh cache list --ref refs/heads/main --key "swift-build-v2-coverage-6.3-linux-" \
            --limit 100 --json id --jq '.[].id' >> "$cache_ids"
          gh cache list --ref refs/heads/main --key "swift-build-coverage-6.3-linux-" \
            --limit 100 --json id --jq '.[].id' >> "$cache_ids"
          while IFS= read -r cache_id; do
            [ -n "$cache_id" ] || continue
            gh cache delete "$cache_id"
          done < "$cache_ids"
