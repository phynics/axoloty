name: Live Wire Compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run-live:
        description: Force the live suite even when the change set is not protocol-affecting.
        required: false
        default: "false"
        type: boolean
      exemption:
        description: Reference to a recorded reviewed exemption (issue/PR/link) that waives the live gate.
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # Head refs are only branch names and can collide across forked PRs. Use
  # the PR number for pull requests so one contributor cannot cancel or queue
  # behind another contributor's identically named branch. Pushes retain the
  # branch ref, and are never cancelled, preserving compatibility evidence.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The live wire gate (issue #457) enforces recorded compatibility evidence for
# protocol-affecting changes. This job ALWAYS runs so it is a reliable required
# status check: unrelated changes fast-path to a pass without the expensive
# containerized live capture, while protocol-affecting changes must run the
# live CoatyJS capture and its verifier. An explicit reviewed exemption (PR
# label + recorded rationale/expiry reference) waives only the live capture;
# it is never treated as a protocol-affecting pass.

# Exemption label: add `live-wire-exemption` to a protocol-affecting PR together
# with a comment/description citing the recorded decision (issue/PR/link) and
# its expiry. See docs/wire-compatibility.md.
env:
  # Rootless Podman may need longer than the default two minutes to create the
  # first container after image setup on a busy hosted runner.
  CONTAINER_CREATE_TIMEOUT_SECONDS: "300"
  WIRE_EXEMPTION_LABEL: live-wire-exemption
  WIRE_OUTPUT_DIR: .testing/runs/wire-${{ github.run_id }}-${{ github.run_attempt }}/wire
  WIRE_CI_EVIDENCE_ROOT: .testing/runs/wire-${{ github.run_id }}-${{ github.run_attempt }}/ci
  WIRE_RUN_ID: wire-${{ github.run_id }}-${{ github.run_attempt }}
  WIRE_LIFECYCLE_RUN_ID: wire-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  live-coatyjs:
    name: Live CoatyJS compatibility gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Create the CI-owned record before any setup or dependency step can
      # fail. This is run metadata, not wire evidence.
      - name: Initialize wire run record
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p "$WIRE_CI_EVIDENCE_ROOT"
          node Tests/Support/WireCompatibility/Live/record-ci-run.mjs \
            --file "$WIRE_CI_EVIDENCE_ROOT/run-status.json" \
            --phase init \
            --run-id "$WIRE_RUN_ID" \
            --run-attempt "${GITHUB_RUN_ATTEMPT:-1}" \
            --event "${GITHUB_EVENT_NAME:-unknown}" \
            --sha "${GITHUB_SHA:-unknown}" \
            --note "initialized before live-wire setup" || {
              echo "::warning::could not initialize the wire CI run record"
              printf '%s\n' '{"format":"axoloty-wire-ci-run/v1","captureEvidence":"not-claimed","lastPhase":"init"}' > "$WIRE_CI_EVIDENCE_ROOT/run-status.json"
            }

      - name: Compute changed files
        id: changed
        shell: bash
        env:
          FORCE_RUN: ${{ inputs.run-live || 'false' }}
        run: |
          set -euo pipefail
          if [[ "$FORCE_RUN" == "true" ]]; then
            echo "forcing live wire run from workflow_dispatch"
          fi
          case "${{ github.event_name }}" in
            pull_request)
              base="${{ github.event.pull_request.base.sha }}"
              head="${{ github.event.pull_request.head.sha }}"
              ;;
            push)
              base="${{ github.event.before }}"
              head="${{ github.event.after }}"
              if [ "$base" = "0000000000000000000000000000000000000000" ]; then
                base=""
              fi
              ;;
            *)
              base=""
              head=""
              ;;
          esac
          if [ -n "$base" ]; then
            git diff --name-only "$base" "$head" > "$WIRE_CI_EVIDENCE_ROOT/changed-paths.txt"
          else
            : > "$WIRE_CI_EVIDENCE_ROOT/changed-paths.txt"
          fi
          changed="$(tr '\n' ' ' < "$WIRE_CI_EVIDENCE_ROOT/changed-paths.txt" | sed 's/ $//')"
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
          echo "Changed files: ${changed:-<none>}"

      - name: Classify the change set
        id: classify
        env:
          CHANGED: ${{ steps.changed.outputs.changed }}
          FORCE_RUN: ${{ inputs.run-live || 'false' }}
          EXEMPTION: ${{ inputs.exemption }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          exemption="$EXEMPTION"
          if [[ "${{ github.event_name }}" == "pull_request" && \
                "$PR_LABELS" == *"$WIRE_EXEMPTION_LABEL"* ]]; then
            exemption="${exemption:-$WIRE_EXEMPTION_LABEL label}"
          fi
          if [[ "$FORCE_RUN" == "true" ]]; then
            echo "protocol=1" >> "$GITHUB_OUTPUT"
            echo "exempt=0" >> "$GITHUB_OUTPUT"
            node Tests/Support/WireCompatibility/Live/record-ci-run.mjs \
              --file "$WIRE_CI_EVIDENCE_ROOT/run-status.json" --phase classification \
              --protocol 1 --exempt 0 --changed-file-list "$WIRE_CI_EVIDENCE_ROOT/changed-paths.txt" \
              --note "forced live run" || echo "::warning::could not persist forced-run classification"
            echo "Collecting fresh live wire evidence (forced)."
            exit 0
          fi
          set +e
          classifier="$(node Tests/Support/classify-wire-change.mjs \
            --changed "${CHANGED:-}" --exempt "${exemption:-}")"
          classifier_status=$?
          set -e
          echo "$classifier"
          if [[ "$classifier_status" -gt 1 ]]; then
            echo "protocol=unknown" >> "$GITHUB_OUTPUT"
            echo "exempt=0" >> "$GITHUB_OUTPUT"
            node Tests/Support/WireCompatibility/Live/record-ci-run.mjs \
              --file "$WIRE_CI_EVIDENCE_ROOT/run-status.json" --phase classification \
              --protocol unknown --exempt 0 --changed-file-list "$WIRE_CI_EVIDENCE_ROOT/changed-paths.txt" \
              --note "classifier failed with exit $classifier_status" || true
            exit "$classifier_status"
          fi
          # Consume the machine-readable marker emitted on the first line; the
          # free-text summary below it is for humans only.
          if printf '%s' "$classifier" | grep -q "^gate=require"; then
            echo "protocol=1" >> "$GITHUB_OUTPUT"
            if printf '%s' "$classifier" | grep -q "exemption recorded"; then
              echo "exempt=1" >> "$GITHUB_OUTPUT"
              classification_exempt=1
            else
              echo "exempt=0" >> "$GITHUB_OUTPUT"
              classification_exempt=0
            fi
            classification_protocol=1
          else
            echo "protocol=0" >> "$GITHUB_OUTPUT"
            echo "exempt=0" >> "$GITHUB_OUTPUT"
            classification_protocol=0
            classification_exempt=0
          fi
          node Tests/Support/WireCompatibility/Live/record-ci-run.mjs \
            --file "$WIRE_CI_EVIDENCE_ROOT/run-status.json" --phase classification \
            --protocol "$classification_protocol" --exempt "$classification_exempt" \
            --changed-file-list "$WIRE_CI_EVIDENCE_ROOT/changed-paths.txt" || \
            echo "::warning::could not persist change-set classification"

      - name: Fast path (no protocol-affecting change, no forced run)
        if: steps.classify.outputs.protocol == '0'
        run: |
          echo "No protocol-affecting paths changed. The live wire gate does not apply; keeping this change on the fast path."

      - name: Exemption recorded (live capture not required)
        if: steps.classify.outputs.protocol == '1' && steps.classify.outputs.exempt == '1'
        run: |
          echo "A reviewed exemption is recorded for this protocol-affecting change; the live capture is waived."
          echo "The exemption reference and expiry must be documented on the PR and in the compatibility matrix."

      # The hosted runner already provides Node for the classifier and run
      # record. Defer every dependency and container setup cost until the
      # change set is known to require fresh, unexempted wire evidence.
      # hashFiles() is only valid in step-level expressions, not
      # workflow/job-level `env:`, so compute the cache key here and
      # export it for later steps.
      - name: Compute cache key
        if: steps.classify.outputs.protocol == '1' && steps.classify.outputs.exempt == '0'
        run: |
          echo "SWIFT_CACHE_KEY=swiftpm-v2-6.3-linux-${{ hashFiles('Package.resolved', '.devcontainer/Dockerfile', '.devcontainer/image-lock.json') }}" >> "$GITHUB_ENV"

      - name: Setup container image
        if: steps.classify.outputs.protocol == '1' && steps.classify.outputs.exempt == '0'
        uses: ./.github/actions/setup-container
        with:
          runtime: podman

      - name: Restore SwiftPM dependency cache
        if: steps.classify.outputs.protocol == '1' && steps.classify.outputs.exempt == '0'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .swiftpm-cache
          key: ${{ env.SWIFT_CACHE_KEY }}

      - name: Setup Node.js
        if: steps.classify.outputs.protocol == '1' && steps.classify.outputs.exempt == '0'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Tests/Support/WireCompatibility/tool/package-lock.json

      - name: Build wire CLI
        if: steps.classify.outputs.protocol == '1' && steps.classify.outputs.exempt == '0'
        run: make wire-tool

      - name: Run live wire capture and verifier
        if: steps.classify.outputs.protocol == '1' && steps.classify.outputs.exempt == '0'
        run: |
          node Tests/Support/WireCompatibility/Live/record-ci-run.mjs \
            --file "$WIRE_CI_EVIDENCE_ROOT/run-status.json" --phase capture --capture-state running || true
          set +e
          make test-wire-live CONTAINER_RUNTIME=podman BUILD_DIR=.build BUILD_LOCK=0 SPM_CACHE_DIR=.swiftpm-cache AXOLOTY_HOST_RUNTIME_BRIDGE=1 AXOLOTY_TOOL_CONTAINER_ENV_VARS=CONTAINER_CREATE_TIMEOUT_SECONDS
          capture_status=$?
          set -e
          if [ "$capture_status" -eq 0 ]; then capture_state=succeeded; else capture_state=failed; fi
          node Tests/Support/WireCompatibility/Live/record-ci-run.mjs \
            --file "$WIRE_CI_EVIDENCE_ROOT/run-status.json" --phase capture \
            --capture-state "$capture_state" --note "capture command exit $capture_status" || true
          exit "$capture_status"

      - name: Verify live evidence is present
        if: steps.classify.outputs.protocol == '1' && steps.classify.outputs.exempt == '0'
        run: |
          set -u
          node Tests/Support/WireCompatibility/Live/record-ci-run.mjs \
            --file "$WIRE_CI_EVIDENCE_ROOT/run-status.json" --phase verification \
            --verification-state running || true
          set +e
          manifest="$WIRE_OUTPUT_DIR/manifest.json"
          cap_dir="$WIRE_OUTPUT_DIR"
          verify_status=0
          test -d "$cap_dir" || { echo "::error::live wire capture directory missing: $cap_dir"; verify_status=1; }
          test -s "$manifest" || { echo "::error::live wire manifest missing: $manifest"; verify_status=1; }
          captures="$(find "$cap_dir" -name '*.jsonl' -type f | wc -l)"
          if [ "$captures" -eq 0 ]; then
            echo "::error::no live wire captures produced"
            verify_status=1
          fi
          if [ "$verify_status" -eq 0 ]; then
            # The authoritative aggregate manifest was produced by the wire
            # capture plan; verify it references the captures rather than
            # regenerating it.
            node Tests/Support/WireCompatibility/tool/dist/index.js manifest "$cap_dir" /tmp/wire-verify-manifest.json || verify_status=$?
          fi
          if [ "$verify_status" -eq 0 ]; then
            echo "Live wire evidence OK: $(find "$cap_dir" -name '*.jsonl' -type f -printf '%P\n' | sort | tr '\n' ' ')"
            echo "Authoritative manifest: $manifest"
            verification_state=succeeded
          else
            verification_state=failed
          fi
          node Tests/Support/WireCompatibility/Live/record-ci-run.mjs \
            --file "$WIRE_CI_EVIDENCE_ROOT/run-status.json" --phase verification \
            --verification-state "$verification_state" --note "verification exit $verify_status" || true
          exit "$verify_status"

      - name: Collect wire runner and owned-runtime diagnostics
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set +e
          root="$WIRE_CI_EVIDENCE_ROOT"
          mkdir -p "$root"
          inventory="$root/runner-and-owned-runtime-inventory.txt"
          {
            echo "run_id=$WIRE_RUN_ID"
            echo "job_status=${JOB_STATUS:-unknown}"
            echo "# runner process inventory"
            ps -eo pid=,ppid=,pgid=,sid=,stat=,etime=,args=
            echo "# owned containers"
            if command -v podman >/dev/null 2>&1; then
              timeout 10s podman ps -a --no-trunc \
                --filter "label=io.axoloty.run-id=$WIRE_RUN_ID" \
                --format 'container={{.ID}} name={{.Names}} status={{.Status}} labels={{.Labels}}'
              echo "# owned networks"
              timeout 10s podman network ls --no-trunc \
                --filter "label=io.axoloty.run-id=$WIRE_RUN_ID" \
                --format 'network={{.ID}} name={{.Name}} labels={{.Labels}}'
            else
              echo "runtime unavailable: podman"
            fi
          } > "$inventory" 2>&1
          cleanup_report="$root/owned-runtime-cleanup.txt"
          cleanup_status=0
          {
            echo "run_id=$WIRE_RUN_ID"
            echo "# label-scoped container cleanup"
            if command -v podman >/dev/null 2>&1; then
              owned_containers="$(timeout 10s podman ps -aq --filter "label=io.axoloty.run-id=$WIRE_RUN_ID" 2>/dev/null || true)"
              if [ -n "$owned_containers" ]; then
                while IFS= read -r container_id; do
                  [ -n "$container_id" ] || continue
                  echo "removing container=$container_id"
                  if ! timeout 30s podman rm --force "$container_id"; then
                    echo "cleanup failed for container=$container_id"
                    cleanup_status=1
                  fi
                done <<< "$owned_containers"
              else
                echo "no owned containers remained before cleanup"
              fi
              for attempt in 1 2 3 4; do
                remaining="$(timeout 10s podman ps -aq --filter "label=io.axoloty.run-id=$WIRE_RUN_ID" 2>/dev/null || true)"
                [ -z "$remaining" ] && break
                echo "waiting for owned runtime reap attempt=$attempt containers=$remaining"
                sleep 1
              done
              remaining="$(timeout 10s podman ps -aq --filter "label=io.axoloty.run-id=$WIRE_RUN_ID" 2>/dev/null || true)"
              if [ -n "$remaining" ]; then
                echo "owned containers remained after bounded cleanup: $remaining"
                cleanup_status=1
              else
                echo "owned containers reaped"
              fi
            else
              echo "runtime unavailable: podman"
            fi
            echo "cleanup_status=$cleanup_status"
          } > "$cleanup_report" 2>&1
          cat "$cleanup_report" >> "$inventory"
          if [ "$cleanup_status" -ne 0 ]; then
            echo "::warning::owned live-wire runtime cleanup did not fully reap its labeled containers"
          fi
          node Tests/Support/WireCompatibility/Live/record-ci-run.mjs \
            --file "$root/run-status.json" --phase diagnostics \
            --job-status "${JOB_STATUS:-unknown}" --inventory-path "$inventory" || \
            echo "::warning::could not persist wire runner diagnostics"

      - name: Upload live wire evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wire-captures-${{ github.run_id }}
          path: |
            .testing/runs/**
          # The init step guarantees the CI record even on setup failure or a
          # fast path. An empty upload is therefore a real artifact failure.
          if-no-files-found: error
          retention-days: 30

      - name: Report gate summary
        if: always()
        env:
          PROTOCOL: ${{ steps.classify.outputs.protocol }}
          EXEMPT: ${{ steps.classify.outputs.exempt }}
        run: |
          {
            echo "### Live wire compatibility gate"
            if [[ "$PROTOCOL" == "0" ]]; then
              echo "- **Fast path**: no protocol-affecting paths changed."
            elif [[ "$EXEMPT" == "1" ]]; then
              echo "- **Exemption**: protocol-affecting change written by recorded reviewed exemption."
              echo "- Evidence upload: exempt -- no fresh capture produced."
            else
              echo "- **Protocol-affecting**: live CoatyJS capture + verifier enforced (or recorded as unavailable)."
            fi
            echo "- CI run record: \`$WIRE_CI_EVIDENCE_ROOT/run-status.json\`"
            echo "- Runner/owned-runtime diagnostics: \`$WIRE_CI_EVIDENCE_ROOT/runner-and-owned-runtime-inventory.txt\`"
          } >> "$GITHUB_STEP_SUMMARY"
