name: Nightly Fuzz Campaign

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      iterations:
        description: Iterations per seed (1-1000000)
        required: false
        default: "100000"
      seeds:
        description: Comma-separated decimal seeds
        required: false
        default: "1,2,3,4"
      repetitions:
        description: Repetitions per seed (1-10)
        required: false
        default: "1"
      jobs:
        description: Parallel workers (1-8)
        required: false
        default: "2"

permissions:
  contents: read

concurrency:
  group: nightly-fuzz
  cancel-in-progress: false

jobs:
  fuzz:
    name: Auditable fuzz campaign
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AXOLOTY_FUZZ_ITERATIONS: ${{ inputs.iterations || '100000' }}
      AXOLOTY_FUZZ_SEEDS: ${{ inputs.seeds || '1,2,3,4' }}
      AXOLOTY_FUZZ_REPETITIONS: ${{ inputs.repetitions || '1' }}
      AXOLOTY_FUZZ_JOBS: ${{ inputs.jobs || '2' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # hashFiles() is only valid in step-level expressions, not
      # workflow/job-level `env:`, so compute the cache key here and
      # export it for later steps.
      - name: Compute cache key
        run: |
          echo "SWIFT_CACHE_KEY=swiftpm-6.3-linux-${{ hashFiles('Package.resolved', '.devcontainer/Dockerfile') }}" >> "$GITHUB_ENV"

      - name: Setup pinned development image
        uses: ./.github/actions/setup-container
        with:
          runtime: podman
          # The campaign compiles the bind-mounted checkout and does not use
          # binaries embedded in the image.
          require-current-build-inputs: "false"

      - name: Restore SwiftPM dependency cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .swiftpm-cache
          key: ${{ env.SWIFT_CACHE_KEY }}
          restore-keys: |
            swiftpm-6.3-linux-

      - name: Validate campaign inputs
        shell: bash
        run: |
          set -euo pipefail

          positive_integer() {
            [[ "$1" =~ ^[1-9][0-9]*$ ]]
          }

          bounded_integer() {
            local value="$1" maximum="$2"
            positive_integer "$value" && (( value <= maximum ))
          }

          bounded_integer "$AXOLOTY_FUZZ_ITERATIONS" 1000000 || {
            echo "iterations must be an integer from 1 to 1000000" >&2
            exit 1
          }
          bounded_integer "$AXOLOTY_FUZZ_REPETITIONS" 10 || {
            echo "repetitions must be an integer from 1 to 10" >&2
            exit 1
          }
          bounded_integer "$AXOLOTY_FUZZ_JOBS" 8 || {
            echo "jobs must be an integer from 1 to 8" >&2
            exit 1
          }
          [[ "$AXOLOTY_FUZZ_SEEDS" =~ ^[0-9]+(,[0-9]+)*$ ]] || {
            echo "seeds must be comma-separated decimal integers" >&2
            exit 1
          }
          IFS=',' read -r -a seeds <<< "$AXOLOTY_FUZZ_SEEDS"
          for seed in "${seeds[@]}"; do
            bounded_integer "$seed" 4294967295 || {
              echo "each seed must be an integer from 1 to 4294967295" >&2
              exit 1
            }
          done

      - name: Run fuzz campaign
        run: make fuzz-long CONTAINER_RUNTIME=podman IMAGE=axoloty-dev BUILD_LOCK=0 SPM_CACHE_DIR=.swiftpm-cache

      - name: Summarize campaign
        if: always()
        shell: bash
        run: |
          node Tests/Support/fuzz-summary.mjs .testing/fuzz

      - name: Upload campaign evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-fuzz-${{ github.run_id }}
          path: .testing/fuzz/
          if-no-files-found: warn
          retention-days: 30
